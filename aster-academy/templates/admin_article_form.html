<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{FORM_HEADING}} · Aster Academy</title><link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f4f7fc;color:#172b4d}.panel{border:1px solid #dce6f2;border-radius:16px;background:#fff;box-shadow:0 8px 24px #1f3d630b}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;background:linear-gradient(110deg,#1d4ed8,#3b82f6);padding:11px 16px;color:#fff;font-weight:700}.btn-secondary{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d5dfec;border-radius:11px;background:#fff;padding:10px 14px;color:#29405f;font-weight:600}.field{width:100%;border:1px solid #cbd8e8;border-radius:11px;padding:11px 13px}.editor{background:#fff}.ql-toolbar.ql-snow{border:1px solid #cbd8e8;border-radius:11px 11px 0 0}.ql-container.ql-snow{border:1px solid #cbd8e8;border-radius:0 0 11px 11px;font:15px/1.65 system-ui}.editor-title .ql-editor{font-size:1.2rem;font-weight:700}.editor-summary .ql-editor{min-height:110px}.editor-body .ql-editor{min-height:300px}</style></head><body><div class="admin-shell"><aside></aside><div class="admin-main"><header class="admin-topbar"><div><div class="admin-top-title">Administrasi Aster Academy</div><div class="admin-top-caption">Kelola artikel publik</div></div></header><main class="admin-page"><a href="/admin/artikel" class="text-sm font-semibold text-blue-700">← Artikel</a><h1 class="mt-3 text-3xl font-bold">{{FORM_HEADING}}</h1><p class="mt-2 text-slate-600">Gunakan editor untuk setiap konten teks. Sistem menyaring format yang tidak aman sebelum disimpan.</p>{{FORM_ERROR}}<form id="articleForm" method="post" action="/admin/artikel/simpan" class="panel mt-6 max-w-4xl space-y-6 p-6"><input type="hidden" name="article_id" value="{{ARTICLE_ID}}"><input id="titleValue" type="hidden" name="title" value="{{TITLE}}"><input class="field" name="slug" required maxlength="160" value="{{SLUG}}" pattern="[a-z0-9-]+" placeholder="slug-artikel"><input id="categoryValue" type="hidden" name="category" value="{{CATEGORY}}"><input id="summaryValue" type="hidden" name="summary" value="{{SUMMARY}}"><input id="bodyValue" type="hidden" name="body" value="{{BODY}}"><section><label class="font-semibold">Judul</label><div id="titleEditor" class="editor editor-title mt-2" aria-label="Editor judul"></div></section><section><label class="font-semibold">Kategori</label><div id="categoryEditor" class="editor mt-2" aria-label="Editor kategori"></div></section><section><label class="font-semibold">Ringkasan</label><div id="summaryEditor" class="editor editor-summary mt-2" aria-label="Editor ringkasan"></div></section><section><label class="font-semibold">Isi artikel</label><div id="bodyEditor" class="editor editor-body mt-2" aria-label="Editor isi artikel"></div></section><label class="flex items-center gap-3 {{ARTICLE_PUBLISH_CLASS}}"><input type="checkbox" name="published" value="1" {{PUBLISHED_CHECKED}}> Terbitkan artikel</label><p id="editorStatus" class="text-sm text-slate-600" role="status"></p><div class="flex gap-3"><button class="btn" type="submit">Simpan artikel</button><a class="btn-secondary" href="/admin/artikel">Batal</a></div></form></main></div></div><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const form=document.querySelector('#articleForm'),status=document.querySelector('#editorStatus');if(!window.Quill){status.textContent='Editor tidak dapat dimuat. Muat ulang saat koneksi tersedia.';return}const toolbar=[['bold','italic','underline'],[{header:[2,3,false]},{list:'ordered'},{list:'bullet'}],['link'],['clean']];const plain=[['bold','italic','underline'],['clean']];function editor(host,field,tools){const q=new Quill(host,{theme:'snow',modules:{toolbar:tools}}),input=document.querySelector(field);if(input.value)q.clipboard.dangerouslyPasteHTML(input.value);return[q,input]}const title=editor('#titleEditor','#titleValue',plain),category=editor('#categoryEditor','#categoryValue',plain),summary=editor('#summaryEditor','#summaryValue',toolbar),body=editor('#bodyEditor','#bodyValue',toolbar);form.addEventListener('submit',e=>{for(const[q,input]of[title,category,summary,body])input.value=q.root.innerHTML==='<p><br></p>'?'':q.root.innerHTML;const text=q=>q.getText().trim();if(!text(title[0])||!text(body[0])){e.preventDefault();status.textContent='Judul dan isi artikel wajib diisi.';(!text(title[0])?title[0]:body[0]).focus()}})})</script></body></html>
