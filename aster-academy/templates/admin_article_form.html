<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{FORM_HEADING}} · Aster Academy</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><div class="admin-shell"><aside></aside><div class="admin-main"><header class="admin-topbar"><div><div class="admin-top-title">Administrasi Aster Academy</div><div class="admin-top-caption">Kelola artikel publik</div></div></header><main class="admin-page"><a href="/admin/artikel" class="text-sm font-semibold text-blue-700">← Artikel</a><h1 class="mt-3 text-3xl font-bold">{{FORM_HEADING}}</h1>{{FORM_ERROR}}<form method="post" action="/admin/artikel/simpan" class="panel mt-6 max-w-3xl space-y-5 p-6"><input type="hidden" name="article_id" value="{{ARTICLE_ID}}"><label class="block font-semibold">Judul<input class="field mt-2" name="title" required maxlength="160" value="{{TITLE}}"></label><label class="block font-semibold">Slug<input class="field mt-2" name="slug" required maxlength="160" value="{{SLUG}}" pattern="[a-z0-9-]+"></label><label class="block font-semibold">Kategori<input class="field mt-2" name="category" maxlength="100" value="{{CATEGORY}}"></label><label class="block font-semibold">Ringkasan<textarea class="field mt-2" name="summary" rows="3" maxlength="500">{{SUMMARY}}</textarea></label><label class="block font-semibold">Isi artikel<textarea class="field mt-2" name="body" rows="12" maxlength="20000" required>{{BODY}}</textarea></label><label class="flex items-center gap-3 {{ARTICLE_PUBLISH_CLASS}}"><input type="checkbox" name="published" value="1" {{PUBLISHED_CHECKED}}> Terbitkan artikel</label><div class="flex gap-3"><button class="btn" type="submit">Simpan</button><a class="btn-secondary" href="/admin/artikel">Batal</a></div></form></main></div></div></body></html>
