<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{FORM_HEADING}} · Aster Academy</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><div class="admin-shell"><aside></aside><div class="admin-main"><header class="admin-topbar"><div><div class="admin-top-title">Administrasi Aster Academy</div><div class="admin-top-caption">Kelola kelas live</div></div></header><main class="admin-page"><a href="/admin/jadwal" class="text-sm font-semibold text-blue-700">← Jadwal</a><h1 class="mt-3 text-3xl font-bold">{{FORM_HEADING}}</h1>{{FORM_ERROR}}<form method="post" action="/admin/jadwal/simpan" class="panel mt-6 max-w-3xl space-y-5 p-6"><input type="hidden" name="session_id" value="{{SESSION_ID}}"><label class="block font-semibold">Judul<input class="field mt-2" name="title" required maxlength="160" value="{{TITLE}}"></label><label class="block font-semibold">Subjek<input class="field mt-2" name="subject" maxlength="100" value="{{SUBJECT}}"></label><label class="block font-semibold">Mulai (WIB)<input class="field mt-2" type="datetime-local" name="starts_at" required value="{{STARTS_AT}}"></label><label class="block font-semibold">Durasi (menit)<input class="field mt-2" type="number" name="duration_min" min="1" max="600" required value="{{DURATION_MIN}}"></label><label class="block font-semibold">Mentor<input class="field mt-2" name="mentor" maxlength="100" value="{{MENTOR}}"></label><label class="block font-semibold">Tautan kelas HTTPS<input class="field mt-2" type="url" name="join_url" maxlength="500" value="{{JOIN_URL}}" placeholder="https://…"></label><label class="flex items-center gap-3 {{LIVE_PUBLISH_CLASS}}"><input type="checkbox" name="published" value="1" {{PUBLISHED_CHECKED}}> Terbitkan jadwal</label><div class="flex gap-3"><button class="btn" type="submit">Simpan</button><a class="btn-secondary" href="/admin/jadwal">Batal</a></div></form></main></div></div></body></html>
