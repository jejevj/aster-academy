<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{FORM_HEADING}} · Aster Academy</title><link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><style>.editor{min-height:84px}.ql-toolbar.ql-snow{border-radius:10px 10px 0 0}.ql-container.ql-snow{border-radius:0 0 10px 10px}</style></head><body class="bg-slate-50 text-slate-800"><div class="admin-shell"><aside></aside><div class="admin-main"><header class="admin-topbar"><div><div class="admin-top-title">Administrasi Aster Academy</div><div class="admin-top-caption">Kelola kelas live</div></div></header><main class="admin-page"><a href="/admin/jadwal" class="text-sm font-semibold text-blue-700">← Jadwal</a><h1 class="mt-3 text-3xl font-bold">{{FORM_HEADING}}</h1>{{FORM_ERROR}}<form method="post" action="/admin/jadwal/simpan" class="panel mt-6 max-w-3xl space-y-5 p-6"><input type="hidden" name="session_id" value="{{SESSION_ID}}"><input type="hidden" id="titleValue" name="title" value="{{TITLE}}"><input type="hidden" id="subjectValue" name="subject" value="{{SUBJECT}}"><input type="hidden" id="mentorValue" name="mentor" value="{{MENTOR}}"><label class="block font-semibold">Judul<div id="titleEditor" class="editor mt-2"></div></label><label class="block font-semibold">Subjek<div id="subjectEditor" class="editor mt-2"></div></label><label class="block font-semibold">Mulai (WIB)<input class="field mt-2" type="datetime-local" name="starts_at" required value="{{STARTS_AT}}"></label><label class="block font-semibold">Durasi (menit)<input class="field mt-2" type="number" name="duration_min" min="1" max="600" required value="{{DURATION_MIN}}"></label><label class="block font-semibold">Mentor<div id="mentorEditor" class="editor mt-2"></div></label><label class="block font-semibold">Tautan kelas HTTPS<input class="field mt-2" type="url" name="join_url" maxlength="500" value="{{JOIN_URL}}" placeholder="https://…"></label><label class="flex items-center gap-3 {{LIVE_PUBLISH_CLASS}}"><input type="checkbox" name="published" value="1" {{PUBLISHED_CHECKED}}> Terbitkan jadwal</label><div class="flex gap-3"><button class="btn" type="submit">Simpan</button><a class="btn-secondary" href="/admin/jadwal">Batal</a></div></form></main></div></div><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const form=document.querySelector('form[action="/admin/jadwal/simpan"]');if(!form||!window.Quill)return;const toolbar=[['bold','italic','underline'],['clean']];const pairs=[['titleEditor','titleValue'],['subjectEditor','subjectValue'],['mentorEditor','mentorValue']].map(([host,id])=>{const input=document.getElementById(id),q=new Quill('#'+host,{theme:'snow',modules:{toolbar}});if(input.value)q.clipboard.dangerouslyPasteHTML(input.value);return[q,input]});form.addEventListener('submit',e=>{for(const[q,input]of pairs)input.value=q.getText().trim();if(!pairs[0][1].value){e.preventDefault();pairs[0][0].focus()}})})</script></body></html>
